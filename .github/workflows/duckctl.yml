# `duckctl` for the machines people reach a duck from — Linux, macOS and Windows — so using it
# does not need a Rust toolchain on the laptop.
#
# Every branch push publishes a moving prerelease `duckctl-dev-<branch>`, beside `dev.yml`'s
# `daemon-dev-<branch>`, so the client of a branch is a download away:
# `scripts/install-duckctl.sh <branch>`. A separate release rather than assets on the daemon's:
# `dev.yml` deletes and recreates that one on every push, in parallel with this, and would race
# these uploads away. The updater never sees these — it lists only tags under its own prefixes
# (`updater/src/source/github.rs`) — and `prune-dev-releases.yml` removes them with the branch.
#
# A tarball per platform rather than the bare binary, so the executable bit survives; a zip for
# Windows, which PowerShell's `Expand-Archive` reads and which has no such bit to lose.
#
# Linux is built on ubuntu-latest, so the binary needs that image's glibc or newer. The macOS
# binaries are unsigned: fetched with curl they run, fetched by a browser they are quarantined.
name: duckctl

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write   # create/replace the per-branch prerelease

concurrency:
  group: duckctl-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runs-on: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-aarch64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-arm64
            runs-on: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled from the arm64 runner: the Xcode SDK carries both architectures.
          - name: macos-x86_64
            runs-on: macos-latest
            target: x86_64-apple-darwin
          - name: windows-x86_64
            runs-on: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        # Git Bash on Windows, so every step below is the same line everywhere.
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: duckctl-${{ matrix.target }}

      # btleplug talks to BlueZ through libdbus, and gilrs reads pads through libudev.
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libudev-dev pkg-config

      - run: cargo build --release --locked -p duckctl --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir dist
          cd target/${{ matrix.target }}/release
          if [ "$RUNNER_OS" = Windows ]; then
            7z a "$GITHUB_WORKSPACE/dist/duckctl-${{ matrix.name }}.zip" duckctl.exe
          else
            tar -czf "$GITHUB_WORKSPACE/dist/duckctl-${{ matrix.name }}.tar.gz" duckctl
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: duckctl-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    # Not in a fork, where the token cannot write releases, nor for Dependabot — as `dev.yml`.
    if: ${{ !github.event.repository.fork && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Delete-then-create, as `dev.yml` does and for its reason: an edit cannot move the tag to
      # the new commit.
      - name: Publish the moving per-branch prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="duckctl-dev-${GITHUB_REF_NAME}"
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" \
            --prerelease \
            --target "${GITHUB_SHA}" \
            --title "duckctl (${GITHUB_REF_NAME})" \
            --notes "\`duckctl\` built from \`${GITHUB_REF_NAME}\` at \`${GITHUB_SHA}\`.

          Install on Linux or macOS:

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/scripts/install-duckctl.sh | sh -s -- ${GITHUB_REF_NAME}
          \`\`\`

          On Windows, download \`duckctl-windows-x86_64.zip\` below. docs/robot/duckctl.md has the steps.

          This tag moves on every push to the branch." \
            dist/*
